apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-proxy-config
data:
  hitch.conf: |
    frontend = "[*]:443"
    backend = "[127.0.0.1]:80"
    pem-file = "/etc/hitch/certs/app.pem"
    user = "hitch"
  default.vcl: |
    vcl 4.0;
    probe api_probe {
        .url = "/";
        .timeout = 1s;
        .interval = 2s;
        .window = 3;
        .threshold = 2;
    }
    backend api {
        .host = "book-app-service";
        .port = "3000";
        .probe = api_probe;
    }
    backend staticserver {
        .host = "127.0.0.1";
        .port = "8080";
    }
    sub vcl_recv {
        if (req.url ~ "^/api/") {
            set req.backend_hint = api;
            return (pass);
        }
        set req.backend_hint = staticserver;
        unset req.http.Cookie;
        return (hash);
    }
    sub vcl_backend_response {
        if (bereq.url !~ "^/api/") {
            set beresp.ttl = 1h;
            unset beresp.http.Set-Cookie;
        }
    }
  nginx.conf: |
    server {
        listen 8080;
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-proxy-deployment
  labels:
    app: edge-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-proxy
  template:
    metadata:
      labels:
        app: edge-proxy
    spec:
      initContainers:
        - name: init-static
          image: book-review-api:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -r /app/public/* /usr/share/nginx/html/ || true"]
          volumeMounts:
            - name: static-html
              mountPath: /usr/share/nginx/html
      containers:
        - name: hitch
          image: hitch:1.7
          ports:
            - containerPort: 443
          volumeMounts:
            - name: hitch-conf
              mountPath: /etc/hitch/hitch.conf
              subPath: hitch.conf
            - name: edge-certs
              mountPath: /etc/hitch/certs
        - name: varnish
          image: varnish:7.3
          ports:
            - containerPort: 80
          volumeMounts:
            - name: varnish-conf
              mountPath: /etc/varnish/default.vcl
              subPath: default.vcl
        - name: static
          image: nginx:alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: static-html
              mountPath: /usr/share/nginx/html
            - name: uploads-storage
              mountPath: /usr/share/nginx/html/uploads
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
      volumes:
        - name: static-html
          emptyDir: {}
        - name: edge-certs
          secret:
            secretName: edge-tls-secret
        - name: hitch-conf
          configMap:
            name: edge-proxy-config
        - name: varnish-conf
          configMap:
            name: edge-proxy-config
        - name: nginx-conf
          configMap:
            name: edge-proxy-config
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: book-app-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: edge-proxy-service
spec:
  type: NodePort
  selector:
    app: edge-proxy
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
      nodePort: 30443
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080

