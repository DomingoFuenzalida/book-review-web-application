apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-app-deployment
  labels:
    app: book-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: book-app
  template:
    metadata:
      labels:
        app: book-app
    spec:
      containers:
        - name: book-app
          image: book-review-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: book-app-config
            - secretRef:
                name: book-app-secrets
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/data
            - name: uploads-storage
              mountPath: /app/public/uploads
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: book-app-data-pvc
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: book-app-uploads-pvc