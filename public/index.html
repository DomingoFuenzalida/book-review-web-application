<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .nav-link.active { font-weight: 600; border-bottom: 2px solid #1e293b; color: #1e293b; }
  </style>
</head>
<body class="bg-gray-50 text-slate-800 min-h-screen flex flex-col">

  
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex justify-between items-center">
      <div class="flex items-baseline gap-8">
        <h1 class="text-xl font-semibold tracking-tight text-slate-900">Library</h1>
        <nav class="hidden sm:flex gap-6" id="main-nav">
          <a href="#/authors" class="nav-link pb-1 text-sm text-slate-500 hover:text-slate-900 transition-colors active">Authors</a>
          <a href="#/books" class="nav-link pb-1 text-sm text-slate-500 hover:text-slate-900 transition-colors">Books</a>
        </nav>
      </div>
      
      
      <div id="auth-section" class="flex items-center gap-3 text-sm"></div>
    </div>
  </header>

  
  <main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 py-8">
    <div id="app-root" class="bg-white rounded-md border border-gray-200 shadow-sm p-6 sm:p-8 min-h-[50vh]">
      
    </div>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
