version: '3.8'

services:
  api:
    image: book-review-api:latest
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_STORAGE_PATH=/app/data/database.sqlite
    volumes:
      - book_data:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  book_data: